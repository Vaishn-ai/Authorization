[project]
name = "authorization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vaishnavi dandekar", email = "vaishnavidandekar81@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "psycopg>=3.3.6",
    "pydantic[email]>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
authorization = "authorization:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
